services:
  db:
    image: postgres:15-alpine
    container_name: artikate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: artikate_db
      POSTGRES_USER: artikate_user
      POSTGRES_PASSWORD: artikate_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artikate_user -d artikate_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: artikate_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artikate_api
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: django-insecure-artikate-docker-prod-key-12345
      DEBUG: "0"
      ALLOWED_HOSTS: "*"
      DB_NAME: artikate_db
      DB_USER: artikate_user
      DB_PASSWORD: artikate_password
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artikate_celery_worker
    restart: unless-stopped
    command: celery -A config worker -l INFO -c 4
    environment:
      SECRET_KEY: django-insecure-artikate-docker-prod-key-12345
      DEBUG: "0"
      ALLOWED_HOSTS: "*"
      DB_NAME: artikate_db
      DB_USER: artikate_user
      DB_PASSWORD: artikate_password
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artikate_celery_beat
    restart: unless-stopped
    command: celery -A config beat -l INFO
    environment:
      SECRET_KEY: django-insecure-artikate-docker-prod-key-12345
      DEBUG: "0"
      ALLOWED_HOSTS: "*"
      DB_NAME: artikate_db
      DB_USER: artikate_user
      DB_PASSWORD: artikate_password
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
